name: Update places
on:
  push:
    branches: [main]
    paths: ["listings/**", "requirements.json", "scripts/enrich.py", "data/gyms_known.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-places
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/enrich.py
      - name: Save results
        run: |
          git config user.name "apartment-hunt-bot"
          git config user.email "apartment-hunt-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update places"
          git pull --rebase origin main
          git push
